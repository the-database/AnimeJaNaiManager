name: Benchmark submission checks
on:
  pull_request:
    paths:
      - "AnimeJaNaiConfEditor/Services/Benchmark*.cs"
      - "AnimeJaNaiConfEditor/Views/MainWindow.axaml.cs"
      - "tests/BenchmarkSubmission/**"
      - ".github/workflows/benchmark-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet run --project tests/BenchmarkSubmission -c Release
